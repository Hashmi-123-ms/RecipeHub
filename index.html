<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecipeHub — Your Recipe Collection</title>
  <meta name="description" content="RecipeHub: add, view, edit, delete and search your favourite recipes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="logo"><span class="logo-mark">🍲</span><b>Recipe<span>Hub</span></b></a>
      <nav>
        <a href="#/" class="nav-link">Recipes</a>
        <a href="#/add" class="btn btn-primary">+ Add Recipe</a>
      </nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container">Made with ♥ by Hashmi · RecipeHub</div>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3>Delete recipe?</h3>
      <p id="modal-text">This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
